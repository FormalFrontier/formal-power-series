version: "v0.4"
project:
  name: Formal Power Series
  description: >-
    Integral weighted negative logarithmic derivatives of native formal-power-series
    units over arbitrary commutative rings, with group laws, naturality and finite
    coefficient formulas; and coefficientwise ideal-adically restricted native
    multivariate power series with finite polynomial reductions, regular-principal
    internal kernels and a polynomial-adic-completion equivalence for adically
    complete coefficient rings. The restricted subring also has a coefficient-ring
    algebra structure, all-level surjective scalar-linear polynomial reductions,
    and regular-principal module-quotient equivalences, including a separate
    native-integer API for default module instances. Over adically complete
    coefficient rings, every polynomial linear endomorphism extends to the
    restricted series, with finite-level and kernel-preserving uniqueness laws.
    Independently of completeness, coefficientwise reduction kernels multiply
    into the kernel at the sum of their levels, including finite-sum laws.
    For adically complete coefficient rings, units of the restricted subring
    are detected by the first polynomial reduction or by constant and
    nonconstant coefficient criteria, with no finite-variable restriction.
    Over finitely many variables, restrictedness has a degree-cutoff criterion;
    if the coefficient ideal is finitely generated, every reduction kernel is
    the intrinsic algebraic image ideal of its corresponding ideal power.
    Separate restricted-series modules add coefficient content, intrinsic
    actual-ring leading terms, division under adic/valuation hypotheses and
    conditional ideal generation by a finite primitive family. A generic
    support leaf compares cofinal ideal-adic filtrations on arbitrary modules.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Prism (Formal Frontier)
    - Anchor (Formal Frontier)
  license: Apache-2.0
sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - Charles A. Weibel
    type: book
    location: "Section II.4 and Exercise 4.6"
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Context for the integral weighted derivative; this focused unit API
      does not assert coverage of the book, section or whole exercise.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - Kazuhiro Fujiwara
      - Fumiharu Kato
    type: book
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Motivation for coefficientwise ideal-adic restricted series; the reusable
      library does not assert correspondence with an appendix or coverage of
      this source.
automation:
  methods:
    - method: agent
      framework: OpenAI Codex CLI / Formal Frontier Hive
      tool_setup: >-
        Formal Frontier AI contributors used the pinned Lean/mathlib project,
        mathlib's native power-series, polynomial, ideal and completion APIs,
        ordinary-import clients, and independent review. Prism wrote the
        original weighted-derivative proof expression; later contributors
        adapted it here. Distinct contributors developed and later assembled
        the restricted-series carrier, principal kernel, inverse-limit,
        scalar-linear quotient, linear extension and kernel-filtration modules;
        distinct contributors developed content, selected factorization,
        leading terms, monic parameters, restricted division, cofinal transport
        and conditional primitive ideal generation. The pinned
        MultivariatePolynomials library supplies the original polynomial
        linear-division and monic-lifting algorithms, not duplicate proofs.
        Further contributors developed the finite-variable degree criterion,
        its infinite-variable regression and the finite-generation kernel
        argument; separate contributors implemented, reviewed and transferred
        their Lean producers and ordinary-import clients.
        Additional contributors developed and transferred restricted-subring
        unit detection and its ordinary-import client, using the existing
        geometric inverse and kernel-filtration APIs.
        Folio contributed the derivative documentation. The antidiagonal
        multiplication method adapts Jz Pan's Apache-2.0 mathlib argument.
        Build and axiom evidence applies only to its exact checked inputs; it
        does not replace independent mathematical review or a release decision.
  divergences: >-
    Native arbitrary-ring units, weighted naming and source-independent
    finite formulas replace source-only experimental names. The independent
    multivariate family uses finite sets of surviving monomial indices rather
    than norm/radius bounds or variable-adic restrictions; principal division
    assumes a regular generator, and the completion equivalence assumes
    adic completeness of coefficients. Scalar-linear reduction applies to
    every ideal and level; only the principal submodule-kernel and quotient
    equivalences assume a regular generator. The separate integer endpoints
    target native default module/quotient types, not merely the generic
    algebra-derived module instance. The extension assumes adic completeness
    of coefficients and its uniqueness requires both polynomial agreement
    and preservation of every coefficientwise reduction kernel, not agreement
    alone or an intrinsic arbitrary-ideal restricted-submodule identity.
    Coefficientwise kernel-product laws assume arbitrary commutative rings,
    ideals and variable types, not completeness or finite variables, and do
    not identify intrinsic restricted-ring ideal powers with those kernels.
    Restricted-subring unit detection assumes actual coefficient adic
    completeness; its quotient-coefficient tests use I rather than I ^ 1
    after transport, and do not assert units of arbitrary ambient series.
    Conversely, the degree-cutoff equivalence assumes finite variables, while
    the intrinsic algebraic reduction kernel for a finitely generated ideal
    additionally assumes finite generation; neither assumes regularity or
    completeness, and neither alters the arbitrary-variable principal kernel.
    Restricted division requires adic completeness and appropriate polynomial
    unit-leading or monic hypotheses; valuation-normalized division additionally
    uses a nonzero maximal-ideal parameter with radical the maximal ideal,
    a finite primitive family and completeness at the original parameter.
    Intrinsic leading terms use actual coefficients in R, whereas normalized
    residue polynomials have coefficients in R modulo the maximal ideal.
    Ideal generation assumes equality of full actual-R leading-term ideals;
    it does not establish existence of such a finite family or unique division.
status:
  scope: >-
    Two independent reusable families: the weighted negative logarithmic
    derivative of power-series units over arbitrary commutative rings, and
    coefficientwise ideal-adically restricted multivariate series, with a
    generic cofinality support leaf. The curated main_results below locate
    21 scalar-linear quotient, eight generic linear-extension, four
    coefficientwise kernel-product and fourteen content/cofinality/
    division/conditional-generation declarations, plus four restricted-unit
    declarations; earlier derivative,
    carrier, principal-kernel and inverse-limit interfaces are documented in
    API.md. Generic reductions
    work for arbitrary ideals; internal division and principal quotients
    require a regular generator. Completion and generic linear extension
    require actual coefficient adic completeness, and linear-extension
    uniqueness also assumes all-level kernel preservation. Kernel products
    are coefficientwise, not intrinsic restricted-ring ideal powers.
    Unit criteria concern the existing restricted subring over arbitrary
    variables and ideals when the coefficient ring is I-adically complete;
    coefficient tests use the quotient by I and the radical of I.
    For finite variables the degree-cutoff equivalence applies, and with a
    finitely generated coefficient ideal the kernel is the intrinsic algebraic
    image ideal at every level, including zero. Neither result asserts
    arbitrary-variable finite-generation kernels or source coverage.
    The ideal-generation result assumes, rather than constructs, a finite
    primitive family with the required actual-R leading-term-ideal equality.
    These result locators do not assert whole-source coverage.
