review:
  status: >-
    Previous releases received independent mathematical review and
    responsible-maintainer code acceptance on their own exact inputs. A
    changed dependency graph or new mathematical declarations require
    applicable build, full transitive axiom evidence, independent review
    and responsible-maintainer acceptance before release. Source
    correspondence and coverage are separate decisions.
  reviewers:
    - Formal Frontier independent mathematical contribution reviewers
  notes: >-
    Earlier proof checks admitted only propext, Classical.choice and
    Quot.sound, including private declarations, on their previous graph.
    Evidence must match the actual graph, including private and generated
    declarations. README.md and API.md describe the public API and limits;
    metadata alone does not certify an approved release or source coverage.
