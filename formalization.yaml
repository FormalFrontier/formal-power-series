review:
  status: >-
    The constituent mathematical contributions received independent review
    and responsible-maintainer code acceptance. Previous build and
    transitive-axiom evidence applies only to its exact inputs. A revised
    release requires applicable changed-input checks, independent review
    and maintainer acceptance; source correspondence and coverage are
    separate decisions.
  reviewers:
    - Formal Frontier independent mathematical contribution reviewers
  notes: >-
    The earlier proof checks admitted only propext, Classical.choice and
    Quot.sound, including private declarations. The public API and limitations
    are described in README.md and API.md. This metadata does not itself
    certify an approved release or whole-source coverage.
